services:
  - type: web
    name: la-parking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: python server.py
    envVars:
      # Generate with: python vapid_keys.py
      # Paste the values in the Render dashboard. Do not commit them.
      # sync: false keeps dashboard values from being wiped on the next blueprint sync.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # OpenAI vision key for Scan sign. Leave blank to keep photo evidence and type the sign.
      # Optional SIGN_VISION_MODEL (default gpt-4o-mini) and SIGN_VISION_URL are read from the environment too.
      - key: SIGN_VISION_API_KEY
        sync: false
